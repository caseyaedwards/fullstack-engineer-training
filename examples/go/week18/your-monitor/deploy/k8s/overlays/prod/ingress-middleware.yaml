# region: ingress-middleware
# Every request through the Week 16 Ingress passes the middleware first.
# The value reads <namespace>-<middleware name>@kubernetescrd.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: your-monitor
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: your-monitor-ratelimit@kubernetescrd
# endregion: ingress-middleware
