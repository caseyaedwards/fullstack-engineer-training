# contract stub: week 15
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: your-monitor-worker
          imagePullPolicy: IfNotPresent
          args: ["-workers", "$(WORKERS)"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: your-monitor
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://monitor:$(POSTGRES_PASSWORD)@postgres:5432/monitor?sslmode=disable
            - name: WORKERS
              valueFrom:
                configMapKeyRef:
                  name: your-monitor-config
                  key: WORKERS
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
