# region: kind-config
# A kind cluster with one node, which runs both the control plane and
# your pods. Create it with make kind-up.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# The kubectl context becomes kind-your-monitor.
name: your-monitor
nodes:
  - role: control-plane
    # Kubernetes 1.36, from the release notes of kind v0.33.0. The digest
    # pins the exact image that kind publishes.
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    # Port 3000 on your laptop, and only on 127.0.0.1, reaches port 30080
    # of the node: the NodePort of the web Service.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 3000
        listenAddress: "127.0.0.1"
        protocol: TCP
# endregion: kind-config
