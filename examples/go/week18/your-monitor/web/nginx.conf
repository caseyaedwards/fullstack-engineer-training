# nginx in the web image: serves the built page from dist/ and passes
# every /api/ request on to the api.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Compress text answers. Images and fonts are already compressed.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # api is the Compose service name, and the Kubernetes Service name.
        # nginx looks it up once, at start. In Kubernetes that is safe: the
        # Service address stays the same while api pods come and go.
        proxy_pass http://api:8080;
        # The api always sees nginx as the other end of the connection. This
        # header carries the address of the browser, for an api that reads it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # region: healthz
    # The kubelet probes this path. nginx answers it itself, without asking
    # the api: a web pod is healthy while nginx runs, even when the api is
    # down. access_log off keeps a probe every few seconds out of the log.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}\n';
    }
    # endregion: healthz

    # Vite puts a hash of the content into every file name under /assets/,
    # such as index-CHghxbEO.js. A changed file gets a new name, which means
    # a browser can keep each file for a year without asking again.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html keeps its name in every build. no-cache makes the browser
    # ask nginx each time whether it changed, which loads a new build at once.
    location / {
        add_header Cache-Control "no-cache";
    }
}
