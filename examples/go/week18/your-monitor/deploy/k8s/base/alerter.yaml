# contract stub: week 15.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alerter
  template:
    metadata:
      labels:
        app: alerter
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: alerter
          image: your-monitor-alerter
          args: ["-metrics-addr", ":2112"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            - name: DATABASE_URL
              value: postgres://monitor:$(POSTGRES_PASSWORD)@postgres:5432/monitor?sslmode=disable
          ports:
            - containerPort: 2112
          readinessProbe:
            httpGet:
              path: /healthz
              port: 2112
          livenessProbe:
            httpGet:
              path: /healthz
              port: 2112
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
