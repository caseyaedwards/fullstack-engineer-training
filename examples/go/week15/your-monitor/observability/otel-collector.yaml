# region: collector
# The OpenTelemetry Collector takes spans from the Go programs over OTLP,
# batches them, and passes them on to Jaeger. To send spans somewhere else,
# change the exporter here: the programs stay as they are.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318 # the programs send to http://otel-collector:4318

processors:
  # Refuse new spans while the collector holds more than 256 MiB, instead
  # of growing until the kernel stops it.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  # Send spans on in batches, not one request per span.
  batch: {}

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true # plain gRPC inside the Compose network

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/jaeger]
  # The collector measures itself too: Prometheus scrapes port 8888.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
# endregion: collector
