# region: nginx
# nginx in the web image: serves the built page from dist/ and passes
# every /api/ request on to the api container.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Compress text answers. Images and fonts are already compressed.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        # api is the Compose service name. nginx looks it up once, at start.
        proxy_pass http://api:8080;
        # Without this header, the api sees the address of nginx on every
        # request instead of the address of the browser.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite puts a hash of the content into every file name under /assets/,
    # such as index-CHghxbEO.js. A changed file gets a new name, which means
    # a browser can keep each file for a year without asking again.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html keeps its name in every build. no-cache makes the browser
    # ask nginx each time whether it changed, which loads a new build at once.
    location / {
        add_header Cache-Control "no-cache";
    }
}
# endregion: nginx
