# Unit tests for slo.rules.yml. Run them with:
#   promtool test rules observability/rules/slo.test.yml
# Each test feeds Prometheus made-up series, evaluates the rules at the
# times listed, and compares the alerts that fire with exp_alerts. An
# empty exp_alerts asserts that the alert does not fire.
rule_files:
  - slo.rules.yml

evaluation_interval: 30s

tests:
  # region: fast-burn-fires
  # The api answers 100 status page requests a minute. At minute 60, every
  # one of them starts failing. The 5-minute window crosses 14.4 times the
  # budget at once; the 1-hour window needs 0.072 * 60 = 4.3 minutes of
  # errors to reach it. The page goes out between minute 64 and 65.
  - name: a full outage pages within five minutes
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="200"}'
        values: '0+100x60 6000x30'
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="500"}'
        values: '0x60 100+100x29'
      - series: 'up{job="scheduler"}'
        values: '1x420'
      - series: 'monitor_jobs_oldest_seconds'
        values: '1x90'
      - series: 'monitor_checks_total{result="up"}'
        values: '0+6x90'
    alert_rule_test:
      - eval_time: 64m
        alertname: ErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 65m
        alertname: ErrorBudgetFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: availability
            exp_annotations:
              summary: "The availability SLO burns its error budget 16.7 times too fast."
              description: "At 14.4 times or more, one hour spends 2% of the 30-day budget, and the whole budget is gone in 50 hours or less."
              runbook_url: https://github.com/your-user/your-monitor/blob/main/docs/runbook.md#errorbudgetfastburn
  # endregion: fast-burn-fires

  # region: blip-does-not-page
  # Two minutes of errors, then the api recovers. The 5-minute window
  # jumps far above 14.4, but the 1-hour window peaks at 200 errors in
  # 6,000 requests, 0.033, under the 0.072 it needs. Nobody gets woken up.
  - name: a two-minute blip does not page
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="200"}'
        values: '0+100x60 6000x2 6000+100x28'
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="500"}'
        values: '0x60 100+100x1 200x28'
      - series: 'up{job="scheduler"}'
        values: '1x420'
      - series: 'monitor_jobs_oldest_seconds'
        values: '1x90'
      - series: 'monitor_checks_total{result="up"}'
        values: '0+6x90'
    alert_rule_test:
      - eval_time: 62m
        alertname: ErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 64m
        alertname: ErrorBudgetFastBurn
        exp_alerts: []
    promql_expr_test:
      - expr: slo:burn_rate:5m{slo="availability"} > bool 14.4
        eval_time: 62m
        exp_samples:
          - labels: '{slo="availability"}'
            value: 1
      - expr: slo:burn_rate:1h{slo="availability"} > bool 14.4
        eval_time: 62m
        exp_samples:
          - labels: '{slo="availability"}'
            value: 0
  # endregion: blip-does-not-page

  # region: page-ends
  # A 20-minute outage, then the fix. The 1-hour window stays above 0.072
  # for most of the next hour, but the 5-minute window drops under it
  # within minutes of the fix, and the page resolves.
  - name: the page resolves minutes after the fix
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="200"}'
        values: '0+100x60 6000x20 6000+100x40'
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="500"}'
        values: '0x60 100+100x19 2000x40'
      - series: 'up{job="scheduler"}'
        values: '1x420'
      - series: 'monitor_jobs_oldest_seconds'
        values: '1x120'
      - series: 'monitor_checks_total{result="up"}'
        values: '0+6x120'
    alert_rule_test:
      - eval_time: 79m
        alertname: ErrorBudgetFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: availability
            exp_annotations:
              summary: "The availability SLO burns its error budget 63.7 times too fast."
              description: "At 14.4 times or more, one hour spends 2% of the 30-day budget, and the whole budget is gone in 50 hours or less."
              runbook_url: https://github.com/your-user/your-monitor/blob/main/docs/runbook.md#errorbudgetfastburn
      - eval_time: 85m
        alertname: ErrorBudgetFastBurn
        exp_alerts: []
    promql_expr_test:
      - expr: slo:burn_rate:1h{slo="availability"} > bool 14.4
        eval_time: 85m
        exp_samples:
          - labels: '{slo="availability"}'
            value: 1
      - expr: slo:burn_rate:5m{slo="availability"} > bool 14.4
        eval_time: 85m
        exp_samples:
          - labels: '{slo="availability"}'
            value: 0
  # endregion: page-ends

  # region: slow-leak
  # One request in 100 fails, for hours: twice the rate the budget allows.
  # Not worth a page, because the budget lasts 15 days at this rate. Worth
  # a ticket, to fix it this week.
  - name: a slow leak opens a ticket and pages nobody
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="200"}'
        values: '0+99x420'
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="500"}'
        values: '0+1x420'
      - series: 'up{job="scheduler"}'
        values: '1x420'
      - series: 'monitor_jobs_oldest_seconds'
        values: '1x420'
      - series: 'monitor_checks_total{result="up"}'
        values: '0+6x420'
    alert_rule_test:
      - eval_time: 7h
        alertname: ErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 7h
        alertname: ErrorBudgetSlowBurn
        exp_alerts: []
      - eval_time: 7h
        alertname: ErrorBudgetTicket
        exp_alerts:
          - exp_labels:
              severity: ticket
              slo: availability
            exp_annotations:
              summary: "The availability SLO has spent its error budget faster than it earns it for 3 days."
              description: "At 1 time or more, three days spend 10% of the 30-day budget. Plan a fix this week."
              runbook_url: https://github.com/your-user/your-monitor/blob/main/docs/runbook.md#errorbudgetticket
  # endregion: slow-leak

  # region: worker-stops
  # Every worker stops at minute 60. The scheduler keeps queuing, and the
  # oldest job ages by 60 seconds a minute. A 30-second step counts as late
  # once the oldest job is past 50 seconds, or once no check has finished
  # for 2 minutes. The 1-hour window needs 14.4 * 1% = 14.4% of its hour,
  # 8.64 minutes, late before the page goes out.
  - name: stopped workers page through the freshness SLO
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="200"}'
        values: '0+100x90'
      - series: 'up{job="scheduler"}'
        values: '1x420'
      - series: 'monitor_jobs_oldest_seconds'
        values: '1x60 60+60x30'
      - series: 'monitor_checks_total{result="up"}'
        values: '0+6x60 360x30'
    alert_rule_test:
      - eval_time: 69m
        alertname: ErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 70m
        alertname: ErrorBudgetFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: freshness
            exp_annotations:
              summary: "The freshness SLO burns its error budget 15.8 times too fast."
              description: "At 14.4 times or more, one hour spends 2% of the 30-day budget, and the whole budget is gone in 50 hours or less."
              runbook_url: https://github.com/your-user/your-monitor/blob/main/docs/runbook.md#errorbudgetfastburn
  # endregion: worker-stops

  # region: scheduler-gone
  # The scheduler pod disappears at minute 60, and with it every series it
  # served. Missing data counts as late, so this pages like a stuck queue.
  - name: a missing scheduler counts as late checks
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="200"}'
        values: '0+100x90'
      - series: 'up{job="scheduler"}'
        values: '1x420'
      - series: 'monitor_jobs_oldest_seconds'
        values: '1x59 stale'
      - series: 'monitor_checks_total{result="up"}'
        values: '0+6x90'
    promql_expr_test:
      - expr: slo:checks_on_time:bool
        eval_time: 59m
        exp_samples:
          - labels: 'slo:checks_on_time:bool'
            value: 1
      - expr: slo:checks_on_time:bool
        eval_time: 61m
        exp_samples:
          - labels: 'slo:checks_on_time:bool'
            value: 0
    alert_rule_test:
      - eval_time: 70m
        alertname: ErrorBudgetFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: freshness
            exp_annotations:
              summary: "The freshness SLO burns its error budget 17.5 times too fast."
              description: "At 14.4 times or more, one hour spends 2% of the 30-day budget, and the whole budget is gone in 50 hours or less."
              runbook_url: https://github.com/your-user/your-monitor/blob/main/docs/runbook.md#errorbudgetfastburn
  # endregion: scheduler-gone

  # region: gauge-holds
  # Postgres goes down at minute 60. Every scheduler round fails, and the
  # gauge keeps the last age it set: 1 second, which looks healthy. No
  # worker can claim a job, which stops monitor_checks_total. The second
  # condition of slo:checks_on_time:bool turns that into late checks.
  - name: a frozen queue gauge still counts as late once checks stop
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="200"}'
        values: '0+100x90'
      - series: 'up{job="scheduler"}'
        values: '1x420'
      - series: 'monitor_jobs_oldest_seconds'
        values: '1x90'
      - series: 'monitor_checks_total{result="up"}'
        values: '0+6x60 360x30'
    promql_expr_test:
      - expr: slo:checks_on_time:bool
        eval_time: 60m
        exp_samples:
          - labels: 'slo:checks_on_time:bool'
            value: 1
      - expr: slo:checks_on_time:bool
        eval_time: 62m
        exp_samples:
          - labels: 'slo:checks_on_time:bool'
            value: 0
    alert_rule_test:
      - eval_time: 69m
        alertname: ErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 70m
        alertname: ErrorBudgetFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: freshness
            exp_annotations:
              summary: "The freshness SLO burns its error budget 15.8 times too fast."
              description: "At 14.4 times or more, one hour spends 2% of the 30-day budget, and the whole budget is gone in 50 hours or less."
              runbook_url: https://github.com/your-user/your-monitor/blob/main/docs/runbook.md#errorbudgetfastburn
  # endregion: gauge-holds

  # region: cold-start
  # Prometheus starts for the first time. The worker finishes its checks
  # once a minute, and the first scrapes can fall between two of them:
  # increase() then reads 0, which looks like stopped workers. The rule
  # records nothing until Prometheus has 2 minutes of history, rather than
  # late steps that page at once.
  - name: a first start of Prometheus pages nobody
    interval: 15s
    input_series:
      - series: 'up{job="scheduler"}'
        values: '_ 1x80'
      - series: 'monitor_jobs_oldest_seconds'
        values: '_ 1x80'
      - series: 'monitor_checks_total{result="up"}'
        values: '_ 0 0 0 0 6 6 6 6 12 12 12 12 18 18 18 18 24 24 24 24 30 30 30 30 36 36 36 36 42 42 42 42 48 48 48 48 54 54 54 54 60 60 60 60 66 66 66 66 72 72 72 72 78 78 78 78 84 84 84 84 90 90 90 90 96 96 96 96 102 102 102 102 108 108 108 108 114 114 114 114'
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="200"}'
        values: '_ 0+10x80'
    promql_expr_test:
      - expr: count_over_time(slo:checks_on_time:bool[2m])
        eval_time: 1m
        exp_samples: []
      - expr: min_over_time(slo:checks_on_time:bool[2m])
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 1
    alert_rule_test:
      - eval_time: 5m
        alertname: ErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 5m
        alertname: ErrorBudgetSlowBurn
        exp_alerts: []
      - eval_time: 20m
        alertname: ErrorBudgetTicket
        exp_alerts: []
  # endregion: cold-start

  # region: status-page-down
  # The probe fails from minute 10: the web pod answers 502, or nobody
  # answers. After 2 minutes pending, StatusPageDown fires. A missing
  # probe result, when blackbox exporter itself is gone, fires it too.
  - name: a failing probe pages after two minutes
    interval: 1m
    input_series:
      - series: 'probe_success{job="status-page-probe", instance="http://web.your-monitor.svc:8080/api/monitors"}'
        values: '1x10 0x10'
    alert_rule_test:
      - eval_time: 12m
        alertname: StatusPageDown
        exp_alerts: []
      - eval_time: 13m
        alertname: StatusPageDown
        exp_alerts:
          - exp_labels:
              severity: page
              slo: availability
              job: status-page-probe
              instance: http://web.your-monitor.svc:8080/api/monitors
            exp_annotations:
              summary: "The status page has failed every probe for 2 minutes."
              description: "Blackbox exporter gets an error or a status outside 200 to 299 from the status page, or Prometheus gets no probe result at all."
              runbook_url: https://github.com/your-user/your-monitor/blob/main/docs/runbook.md#statuspagedown

  - name: a missing probe result pages too
    interval: 1m
    input_series:
      - series: 'probe_success{job="status-page-probe", instance="http://web.your-monitor.svc:8080/api/monitors"}'
        values: '1x9 stale'
    alert_rule_test:
      - eval_time: 13m
        alertname: StatusPageDown
        exp_alerts:
          - exp_labels:
              severity: page
              slo: availability
              job: status-page-probe
            exp_annotations:
              summary: "The status page has failed every probe for 2 minutes."
              description: "Blackbox exporter gets an error or a status outside 200 to 299 from the status page, or Prometheus gets no probe result at all."
              runbook_url: https://github.com/your-user/your-monitor/blob/main/docs/runbook.md#statuspagedown
  # endregion: status-page-down

  - name: the watchdog always fires
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: heartbeat
            exp_annotations:
              summary: "The alerting pipeline works. This alert always fires."
              runbook_url: https://github.com/your-user/your-monitor/blob/main/docs/runbook.md#watchdog
