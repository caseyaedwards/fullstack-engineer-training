# region: hardening
# Copy to /etc/ssh/sshd_config.d/ on the VPS. sshd reads the files there
# in name order, and the first value it reads for a setting wins: 00
# comes before the 50-cloud-init.conf that cloud images can ship.
# Keys only: no passwords, no keyboard-interactive prompts, no root.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
# endregion: hardening
