# region: singletons
# Applied to scheduler and alerter, which run as one pod each. Recreate
# stops the old pod before the new one starts: two schedulers or two
# alerters never run side by side, at the cost of a few seconds with none.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: any # the target in kustomization.yaml picks the Deployments
spec:
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
# endregion: singletons
