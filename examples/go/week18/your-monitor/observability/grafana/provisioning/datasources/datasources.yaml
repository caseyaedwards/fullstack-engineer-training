# region: datasources
# Grafana reads this file at start and adds the data source, which saves
# clicking through Connections > Data sources by hand. Traces stay in the
# Jaeger UI at localhost:16686.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy # the Grafana server sends the queries, not your browser
    url: http://prometheus:9090
    isDefault: true
# endregion: datasources
