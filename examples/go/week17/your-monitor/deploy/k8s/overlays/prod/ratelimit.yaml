# region: middleware
# A Traefik rate limit at the edge, per client address: 50 requests a
# second on average, 100 at once. Traefik answers 429 itself, before the
# request reaches nginx or the api.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit
spec:
  rateLimit:
    average: 50
    period: 1s
    burst: 100
    sourceCriterion:
      ipStrategy:
        ipv6Subnet: 64 # one bucket per IPv6 /64, as in the api
# endregion: middleware
