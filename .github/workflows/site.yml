name: Site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Main deploys queue in order; a newer PR push cancels that PR's older run.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BASE_PATH: /${{ github.event.repository.name }}/
  SITE_URL: https://${{ github.repository_owner }}.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/go/go.mod
          cache-dependency-path: examples/go/go.mod

      - name: Install d2
        run: |
          curl -fsSL -o d2.tar.gz https://github.com/terrastruct/d2/releases/download/v0.7.1/d2-v0.7.1-linux-amd64.tar.gz
          mkdir d2-extract
          tar -xzf d2.tar.gz -C d2-extract --strip-components=1
          sudo cp d2-extract/bin/d2 /usr/local/bin/d2
          d2 --version

      - run: npm ci

      - name: Go examples
        working-directory: examples/go
        run: |
          go vet ./...
          go test -race ./...

      - name: Web examples
        working-directory: examples/web
        run: |
          npm ci
          npm test

      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # The Week 10 status page: Playwright against the Vite dev server.
      # Both lock files hold @playwright/test 1.64.0, which shares
      # the Chromium installed above.
      - name: Web examples, end to end
        working-directory: examples/web
        run: npm run test:e2e

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

      - name: Upload dist for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
