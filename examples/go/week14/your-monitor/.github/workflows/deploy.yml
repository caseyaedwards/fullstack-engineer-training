# region: deploy-head
# Deploy: applies the Kubernetes manifests to the cluster that the
# KUBECONFIG secret names, with the images that CI pushed for one commit.
# It runs only when you start it from the Actions tab or with
# gh workflow run deploy.yml. Week 16 creates the cluster and the secret.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA whose images to deploy. Empty deploys the commit the run starts from.
        required: false
        type: string

permissions:
  contents: read

# One deploy at a time. A second run waits for the first to finish. A
# third run cancels the waiting second one: the newest request wins.
concurrency:
  group: deploy-production
  cancel-in-progress: false
# endregion: deploy-head

# region: deploy-job
jobs:
  deploy:
    runs-on: ubuntu-24.04
    # The KUBECONFIG secret lives in this environment. Its protection
    # rules, such as required reviewers, apply before the job starts.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.5 # Kubernetes 1.36, the version of the cluster

      # kubectl reads KUBECONFIG as a path to a file, not as the file itself.
      # umask 077: only the runner user can read the file.
      - name: Write the kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          umask 077
          printf '%s\n' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      # The input reaches the script through an environment variable, never
      # through ${{ }} inside run:, and must be a full commit SHA.
      - name: Pick the images
        env:
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full 40-character commit SHA"
            exit 1
          fi
          dir=deploy/k8s/release
          mkdir -p "$dir"
          {
            echo "resources:"
            echo "  - ../overlays/prod"
            echo "images:"
            for t in api worker scheduler alerter web; do
              echo "  - name: your-monitor-$t"
              echo "    newName: ghcr.io/${GITHUB_REPOSITORY,,}/$t"
              echo "    newTag: $SHA"
            done
          } > "$dir/kustomization.yaml"
          cat "$dir/kustomization.yaml"

      # apply -k puts every object in the namespace that the base names.
      # rollout status names it too, instead of trusting the kubeconfig.
      - name: Apply and wait
        run: |
          kubectl apply -k deploy/k8s/release
          for d in api worker scheduler alerter web; do
            kubectl rollout status "deployment/$d" --namespace your-monitor --timeout=5m
          done
# endregion: deploy-job
