# region: ingress
# Traefik routes https://status.example.com to the web Service. The
# cert-manager annotation asks for a certificate for every host under
# tls, and cert-manager stores it in the Secret status-page-tls.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: status-page
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: your-monitor-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - status.example.com
      secretName: status-page-tls
  rules:
    - host: status.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
# endregion: ingress
