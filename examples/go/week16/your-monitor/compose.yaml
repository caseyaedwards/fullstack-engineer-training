# region: compose
# The uptime monitor on your laptop: docker compose up starts all six,
# and the four observability services of Week 13.
# The scheduler fills a job queue in Postgres; the worker empties it.
# Compose reads variables such as ${POSTGRES_PASSWORD} from .env.
name: your-monitor

services:
  postgres:
    image: postgres:17
    # Log every statement that runs for 200 ms or longer: the slow-query log.
    command: ["postgres", "-c", "log_min_duration_statement=200ms"]
    environment:
      POSTGRES_USER: monitor
      POSTGRES_DB: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "monitor", "-d", "monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    # region: api-metrics
    command: ["-metrics-addr", ":2112"]
    environment:
      DATABASE_URL: postgres://monitor:${POSTGRES_PASSWORD}@postgres:5432/monitor?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    # endregion: api-metrics
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/api", "-healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  worker:
    build:
      context: .
      target: worker
    command: ["-workers", "${WORKERS:-10}", "-debug-addr", ":6060"]
    environment:
      DATABASE_URL: postgres://monitor:${POSTGRES_PASSWORD}@postgres:5432/monitor?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # region: new-services
  scheduler:
    build:
      context: .
      target: scheduler
    command: ["-metrics-addr", ":2112"]
    environment:
      DATABASE_URL: postgres://monitor:${POSTGRES_PASSWORD}@postgres:5432/monitor?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  alerter:
    build:
      context: .
      target: alerter
    environment:
      DATABASE_URL: postgres://monitor:${POSTGRES_PASSWORD}@postgres:5432/monitor?sslmode=disable
      # Empty: the alerter writes alerts to its log. Set it in .env.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
  # endregion: new-services

  # region: web
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
  # endregion: web

  # region: observability
  # Spans: the Go programs send them to the collector, which passes them
  # on to Jaeger. Port 4318 is open on your laptop too, for programs you
  # start with go run.
  otel-collector:
    image: otel/opentelemetry-collector:0.162.0
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      - jaeger
    restart: on-failure

  # Jaeger stores the spans in memory and shows them at localhost:16686.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686"
    restart: on-failure

  # Metrics: Prometheus scrapes /metrics from the Go programs.
  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: on-failure

  # Grafana shows the dashboard at localhost:3001. Port 3000 is the web
  # service. Log in as admin with GRAFANA_PASSWORD from .env.
  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    restart: on-failure
  # endregion: observability

volumes:
  pgdata:
  promdata:
# endregion: compose
