# region: prometheus
# Prometheus scrapes every target every 15 seconds: it sends GET /metrics
# and stores each number in the answer with the time of the scrape.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:2112"]

  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:2112"]

  # Docker answers a lookup of the name worker with one address for each
  # worker container. dns_sd_configs scrapes every one of them, which keeps
  # docker compose up --scale worker=3 in view.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 6060

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
# endregion: prometheus
