# contract stub: week 15 (copied from content/week-15 at a328ab5, in review)
# The alerter: one pod applies the alert rule. Recreate keeps the copies at
# one during a rollout, which means one notification per incident. With no
# ALERT_WEBHOOK_URL, it writes alerts to its log, as in Compose without one.
# region: alerter
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerter
  labels:
    app.kubernetes.io/name: alerter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alerter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alerter
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alerter
          image: your-monitor-alerter
          args: ["-metrics-addr", ":2112"]
          ports:
            - name: metrics
              containerPort: 2112
          envFrom:
            - configMapRef:
                name: monitor-config
            - secretRef:
                name: postgres
          env:
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable
          # /healthz answers 503 once the loop has run no round for 30 seconds.
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
# endregion: alerter
