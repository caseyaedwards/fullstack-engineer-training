apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # The same Pod Security standard as the your-monitor namespace:
    # restricted, which refuses a pod that runs as root, escalates
    # privileges, adds capabilities or skips the seccomp profile.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
