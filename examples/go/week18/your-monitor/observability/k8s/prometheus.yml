# region: prometheus-k8s
# Prometheus on the cluster. It finds the pods of your monitor through the
# Kubernetes API instead of a fixed list, which keeps every api and worker
# pod in view while the HorizontalPodAutoscaler adds and removes them.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/config/slo.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: your-monitor
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [your-monitor]
    relabel_configs:
      # One target per declared container port. Keep the running pods and
      # the two ports that serve /metrics: 2112 on the api, the scheduler
      # and the alerter, 6060 on the worker.
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: "2112|6060"
        action: keep
      # The container name becomes the job: api, scheduler, worker or
      # alerter. The first three match the job names in Compose, which
      # keeps the Week 13 dashboard queries working on the cluster.
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: job
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # region: probe
  # Synthetic traffic. Every 15 seconds, Prometheus asks blackbox exporter
  # to GET the status page api twice: once through your domain (DNS, the
  # certificate, Traefik and the web pod) and once through the web
  # Service. kube-proxy sends a packet for the VPS's own address straight
  # to Traefik, so neither probe leaves the box. Each probe that reaches
  # the api is one more request in the availability SLI, and probe_success
  # records whether it got a 2xx. Put your own domain in place of
  # status.example.com.
  - job_name: status-page-probe
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://status.example.com/api/monitors
          - http://web.your-monitor.svc:8080/api/monitors
    relabel_configs:
      # Pass the target to blackbox exporter as ?target=..., keep it as
      # the instance label, and scrape blackbox exporter itself.
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  # endregion: probe

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
# endregion: prometheus-k8s
