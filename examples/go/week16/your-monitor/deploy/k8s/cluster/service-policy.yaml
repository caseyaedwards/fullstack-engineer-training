# region: service-policy
# Services in your-monitor stay inside the cluster. A NodePort or a
# LoadBalancer Service, or any Service with externalIPs, opens a port on
# the VPS that ufw never sees, because Kubernetes forwards that traffic
# before ufw's rules run. The way in from the internet is the Traefik
# Ingress, on 80 and 443.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: clusterip-services-only
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [services]
  validations:
    - expression: object.spec.type == 'ClusterIP'
      message: Services in this namespace must have type ClusterIP. Traffic from the internet comes in through the Traefik Ingress.
    # externalIPs sends traffic for those addresses to the Service, even
    # with type ClusterIP: the public address of the VPS would work.
    - expression: "!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0"
      message: Services in this namespace must not set externalIPs. Traffic from the internet comes in through the Traefik Ingress.
---
# The policy applies only where this binding says: the your-monitor
# namespace. Deny refuses the request with the message above.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: clusterip-services-only
spec:
  policyName: clusterip-services-only
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: your-monitor
# endregion: service-policy
