# Unit tests for slo.rules.yml. Run them with:
#   promtool test rules observability/rules/slo.test.yml
# Each test feeds Prometheus made-up series, evaluates the rules at the
# times listed, and compares the alerts that fire with exp_alerts. An
# empty exp_alerts asserts that the alert does not fire.
rule_files:
  - slo.rules.yml

evaluation_interval: 30s

tests:
  # region: fast-burn-fires
  # The api answers 100 status page requests a minute. At minute 60, every
  # one of them starts failing. The 5-minute window crosses 14.4 times the
  # budget at once; the 1-hour window needs 0.072 * 60 = 4.3 minutes of
  # errors to reach it. The input moves a minute at a time, so the 1-hour
  # burn rate jumps from 13.3 at minute 64 to 16.7 at minute 65: 500 failed
  # requests out of the last hour's 6,000. The page goes out at minute 65.
  - name: a full outage pages within five minutes
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="200"}'
        values: '0+100x60 6000x30'
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="500"}'
        values: '0x60 100+100x29'
      - series: 'up{job="scheduler"}'
        values: '1x420'
      - series: 'monitor_jobs_oldest_seconds'
        values: '1x90'
      - series: 'monitor_checks_total{result="up"}'
        values: '0+6x90'
    alert_rule_test:
      - eval_time: 64m
        alertname: ErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 65m
        alertname: ErrorBudgetFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: availability
            exp_annotations:
              summary: "The availability SLO burns its error budget 16.7 times too fast."
              description: "At 14.4 times or more, one hour spends 2% of the 30-day budget, and the whole budget is gone in 50 hours or less."
              runbook_url: https://github.com/your-user/your-monitor/blob/main/docs/runbook.md#errorbudgetfastburn
  # endregion: fast-burn-fires

  # region: blip-does-not-page
  # Two minutes of errors, then the api recovers. The 5-minute window
  # jumps far above 14.4, but the 1-hour window peaks at 200 errors in
  # 6,000 requests, 0.033, under the 0.072 it needs. Nobody gets woken up.
  - name: a two-minute blip does not page
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="200"}'
        values: '0+100x60 6000x2 6000+100x28'
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="500"}'
        values: '0x60 100+100x1 200x28'
      - series: 'up{job="scheduler"}'
        values: '1x420'
      - series: 'monitor_jobs_oldest_seconds'
        values: '1x90'
      - series: 'monitor_checks_total{result="up"}'
        values: '0+6x90'
    alert_rule_test:
      - eval_time: 62m
        alertname: ErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 64m
        alertname: ErrorBudgetFastBurn
        exp_alerts: []
    promql_expr_test:
      - expr: slo:burn_rate:5m{slo="availability"} > bool 14.4
        eval_time: 62m
        exp_samples:
          - labels: '{slo="availability"}'
            value: 1
      - expr: slo:burn_rate:1h{slo="availability"} > bool 14.4
        eval_time: 62m
        exp_samples:
          - labels: '{slo="availability"}'
            value: 0
  # endregion: blip-does-not-page

  # region: page-ends
  # A 20-minute outage, then the fix. The 1-hour window stays above 0.072
  # for most of the next hour, but the 5-minute window drops under it
  # within minutes of the fix, and the page resolves.
  - name: the page resolves minutes after the fix
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="200"}'
        values: '0+100x60 6000x20 6000+100x40'
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="500"}'
        values: '0x60 100+100x19 2000x40'
      - series: 'up{job="scheduler"}'
        values: '1x420'
      - series: 'monitor_jobs_oldest_seconds'
        values: '1x120'
      - series: 'monitor_checks_total{result="up"}'
        values: '0+6x120'
    alert_rule_test:
      - eval_time: 79m
        alertname: ErrorBudgetFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: availability
            exp_annotations:
              summary: "The availability SLO burns its error budget 63.7 times too fast."
              description: "At 14.4 times or more, one hour spends 2% of the 30-day budget, and the whole budget is gone in 50 hours or less."
              runbook_url: https://github.com/your-user/your-monitor/blob/main/docs/runbook.md#errorbudgetfastburn
      - eval_time: 85m
        alertname: ErrorBudgetFastBurn
        exp_alerts: []
    promql_expr_test:
      - expr: slo:burn_rate:1h{slo="availability"} > bool 14.4
        eval_time: 85m
        exp_samples:
          - labels: '{slo="availability"}'
            value: 1
      - expr: slo:burn_rate:5m{slo="availability"} > bool 14.4
        eval_time: 85m
        exp_samples:
          - labels: '{slo="availability"}'
            value: 0
      - expr: slo:sli_error:ratio_rate30m{slo="availability"} > bool 0.5
        eval_time: 85m
        exp_samples:
          - labels: '{slo="availability"}'
            value: 1
  # endregion: page-ends

  # region: slow-leak
  # One request in 100 fails, for hours: twice the rate the budget allows.
  # Not worth a page, because the budget lasts 15 days at this rate. Worth
  # a ticket, to fix it this week.
  - name: a slow leak opens a ticket and pages nobody
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="200"}'
        values: '0+99x420'
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="500"}'
        values: '0+1x420'
      - series: 'up{job="scheduler"}'
        values: '1x420'
      - series: 'monitor_jobs_oldest_seconds'
        values: '1x420'
      - series: 'monitor_checks_total{result="up"}'
        values: '0+6x420'
    alert_rule_test:
      - eval_time: 7h
        alertname: ErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 7h
        alertname: ErrorBudgetSlowBurn
        exp_alerts: []
      - eval_time: 7h
        alertname: ErrorBudgetTicket
        exp_alerts:
          - exp_labels:
              severity: ticket
              slo: availability
            exp_annotations:
              summary: "The availability SLO has spent its error budget faster than it earns it for 3 days."
              description: "At 1 time or more, three days spend 10% of the 30-day budget. Plan a fix this week."
              runbook_url: https://github.com/your-user/your-monitor/blob/main/docs/runbook.md#errorbudgetticket
  # endregion: slow-leak

  # region: slow-burn
  # One request in 20 fails, for hours: ten times the rate the budget
  # allows. The fast burn stays silent, because 10 is under 14.4. The slow
  # burn pages: at this rate, the 30-day budget lasts 3 days.
  - name: five percent errors page through the slow burn
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="200"}'
        values: '0+95x480'
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="500"}'
        values: '0+5x480'
      - series: 'up{job="scheduler"}'
        values: '1x480'
      - series: 'monitor_jobs_oldest_seconds'
        values: '1x480'
      - series: 'monitor_checks_total{result="up"}'
        values: '0+6x480'
    alert_rule_test:
      - eval_time: 7h
        alertname: ErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 7h
        alertname: ErrorBudgetSlowBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: availability
            exp_annotations:
              summary: "The availability SLO burns its error budget 10.0 times too fast."
              description: "At 6 times or more, six hours spend 5% of the 30-day budget, and the whole budget is gone in 5 days or less."
              runbook_url: https://github.com/your-user/your-monitor/blob/main/docs/runbook.md#errorbudgetslowburn
    promql_expr_test:
      - expr: slo:sli_error:ratio_rate30m
        eval_time: 7h
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate30m{slo="availability"}'
            value: 0.05
          - labels: 'slo:sli_error:ratio_rate30m{slo="freshness"}'
            value: 0
      - expr: slo:error_budget:remaining
        eval_time: 7h
        exp_samples:
          - labels: 'slo:error_budget:remaining{slo="availability"}'
            value: -9
          - labels: 'slo:error_budget:remaining{slo="freshness"}'
            value: 1

  # endregion: slow-burn

  # A 5% burst for one hour, then six and a half clean hours. The 3-day
  # window still holds the burst, but the 6-hour window is clean: the
  # problem is over, and the ticket stays shut.
  - name: an old burst opens no ticket
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="200"}'
        values: '0+95x60 5700+100x390'
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="500"}'
        values: '0+5x60 300x390'
    alert_rule_test:
      - eval_time: 7h30m
        alertname: ErrorBudgetTicket
        exp_alerts: []
    promql_expr_test:
      - expr: slo:burn_rate:3d > bool 1
        eval_time: 7h30m
        exp_samples:
          - labels: '{slo="availability"}'
            value: 1

  # Nine clean hours, then six hours at 1.2% errors. The 6-hour window
  # burns at 2.4, but over all 15 hours, 0.48% of requests failed: under
  # the budget, so no ticket yet.
  - name: six bad hours after a clean night open no ticket
    interval: 5m
    input_series:
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="200"}'
        values: '0+500x108 54000+494x72'
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="500"}'
        values: '0x108 0+6x72'
    alert_rule_test:
      - eval_time: 15h
        alertname: ErrorBudgetTicket
        exp_alerts: []
    promql_expr_test:
      - expr: slo:burn_rate:6h > bool 1
        eval_time: 15h
        exp_samples:
          - labels: '{slo="availability"}'
            value: 1
  # region: slow-worker
  # The workers keep checking, but too slowly: from minute 60, the oldest
  # job ages by 60 seconds a minute while the check counter still grows.
  # The queue age alone makes each step late.
  - name: a slow worker pages through the queue age
    interval: 1m
    input_series:
      - series: 'up{job="scheduler"}'
        values: '1x120'
      - series: 'monitor_jobs_oldest_seconds'
        values: '1x60 60+60x30'
      - series: 'monitor_checks_total{result="up"}'
        values: '0+6x120'
    alert_rule_test:
      - eval_time: 69m
        alertname: ErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 70m
        alertname: ErrorBudgetFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: freshness
            exp_annotations:
              summary: "The freshness SLO burns its error budget 15.8 times too fast."
              description: "At 14.4 times or more, one hour spends 2% of the 30-day budget, and the whole budget is gone in 50 hours or less."
              runbook_url: https://github.com/your-user/your-monitor/blob/main/docs/runbook.md#errorbudgetfastburn
  # endregion: slow-worker

  # region: scheduler-gone
  # The scheduler pod disappears at minute 60, and with it every series it
  # served. Missing data counts as late, so this pages like a stuck queue.
  - name: a missing scheduler counts as late checks
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="200"}'
        values: '0+100x90'
      - series: 'up{job="scheduler"}'
        values: '1x420'
      - series: 'monitor_jobs_oldest_seconds'
        values: '1x59 stale'
      - series: 'monitor_checks_total{result="up"}'
        values: '0+6x90'
    promql_expr_test:
      - expr: slo:checks_on_time:bool
        eval_time: 59m
        exp_samples:
          - labels: 'slo:checks_on_time:bool'
            value: 1
      - expr: slo:checks_on_time:bool
        eval_time: 61m
        exp_samples:
          - labels: 'slo:checks_on_time:bool'
            value: 0
    alert_rule_test:
      - eval_time: 70m
        alertname: ErrorBudgetFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: freshness
            exp_annotations:
              summary: "The freshness SLO burns its error budget 17.5 times too fast."
              description: "At 14.4 times or more, one hour spends 2% of the 30-day budget, and the whole budget is gone in 50 hours or less."
              runbook_url: https://github.com/your-user/your-monitor/blob/main/docs/runbook.md#errorbudgetfastburn
  # endregion: scheduler-gone

  # region: gauge-holds
  # Postgres goes down at minute 60. Every scheduler round fails, and the
  # gauge keeps the last age it set: 1 second, which looks healthy. No
  # worker can claim a job, which stops monitor_checks_total. The second
  # condition of slo:checks_on_time:bool turns that into late checks.
  - name: a frozen queue gauge still counts as late once checks stop
    interval: 1m
    input_series:
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="200"}'
        values: '0+100x90'
      - series: 'up{job="scheduler"}'
        values: '1x420'
      - series: 'monitor_jobs_oldest_seconds'
        values: '1x90'
      - series: 'monitor_checks_total{result="up"}'
        values: '0+6x60 360x30'
    promql_expr_test:
      - expr: slo:checks_on_time:bool
        eval_time: 60m
        exp_samples:
          - labels: 'slo:checks_on_time:bool'
            value: 1
      - expr: slo:checks_on_time:bool
        eval_time: 62m
        exp_samples:
          - labels: 'slo:checks_on_time:bool'
            value: 0
    alert_rule_test:
      - eval_time: 69m
        alertname: ErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 70m
        alertname: ErrorBudgetFastBurn
        exp_alerts:
          - exp_labels:
              severity: page
              slo: freshness
            exp_annotations:
              summary: "The freshness SLO burns its error budget 15.8 times too fast."
              description: "At 14.4 times or more, one hour spends 2% of the 30-day budget, and the whole budget is gone in 50 hours or less."
              runbook_url: https://github.com/your-user/your-monitor/blob/main/docs/runbook.md#errorbudgetfastburn
  # endregion: gauge-holds

  # region: cold-start
  # Prometheus starts for the first time. The worker finishes its checks
  # once a minute, and the first scrapes can fall between two of them:
  # increase() then reads 0, which looks like stopped workers. The rule
  # records nothing until Prometheus has 2 minutes of history, rather than
  # late steps that page at once.
  - name: a first start of Prometheus pages nobody
    interval: 15s
    input_series:
      - series: 'up{job="scheduler"}'
        values: '_ 1x80'
      - series: 'monitor_jobs_oldest_seconds'
        values: '_ 1x80'
      - series: 'monitor_checks_total{result="up"}'
        values: '_ 0 0 0 0 6 6 6 6 12 12 12 12 18 18 18 18 24 24 24 24 30 30 30 30 36 36 36 36 42 42 42 42 48 48 48 48 54 54 54 54 60 60 60 60 66 66 66 66 72 72 72 72 78 78 78 78 84 84 84 84 90 90 90 90 96 96 96 96 102 102 102 102 108 108 108 108 114 114 114 114'
      - series: 'http_requests_total{method="GET", route="/api/monitors", code="200"}'
        values: '_ 0+10x80'
    promql_expr_test:
      - expr: count_over_time(slo:checks_on_time:bool[2m])
        eval_time: 1m
        exp_samples: []
      - expr: min_over_time(slo:checks_on_time:bool[2m])
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 1
    alert_rule_test:
      - eval_time: 5m
        alertname: ErrorBudgetFastBurn
        exp_alerts: []
      - eval_time: 5m
        alertname: ErrorBudgetSlowBurn
        exp_alerts: []
      - eval_time: 20m
        alertname: ErrorBudgetTicket
        exp_alerts: []
  # endregion: cold-start

  # region: status-page-down
  # The public probe fails from minute 10: the certificate expired, DNS
  # points elsewhere, or Traefik is down. The probe inside the cluster
  # still passes. After 2 minutes pending, StatusPageDown fires for the
  # failing instance. A missing probe result, when blackbox exporter
  # itself is gone, fires it too.
  - name: a failing probe pages after two minutes
    interval: 1m
    input_series:
      - series: 'probe_success{job="status-page-probe", instance="http://web.your-monitor.svc:8080/api/monitors"}'
        values: '1x20'
      - series: 'probe_success{job="status-page-probe", instance="https://status.example.com/api/monitors"}'
        values: '1x10 0x10'
    alert_rule_test:
      - eval_time: 12m
        alertname: StatusPageDown
        exp_alerts: []
      - eval_time: 13m
        alertname: StatusPageDown
        exp_alerts:
          - exp_labels:
              severity: page
              slo: availability
              job: status-page-probe
              instance: https://status.example.com/api/monitors
            exp_annotations:
              summary: "The status page has failed every probe for 2 minutes."
              description: "Blackbox exporter gets an error or a status outside 200 to 299 from the status page, or Prometheus gets no probe result at all."
              runbook_url: https://github.com/your-user/your-monitor/blob/main/docs/runbook.md#statuspagedown

  - name: a missing probe result pages too
    interval: 1m
    input_series:
      - series: 'probe_success{job="status-page-probe", instance="http://web.your-monitor.svc:8080/api/monitors"}'
        values: '1x9 stale'
    alert_rule_test:
      - eval_time: 13m
        alertname: StatusPageDown
        exp_alerts:
          - exp_labels:
              severity: page
              slo: availability
              job: status-page-probe
            exp_annotations:
              summary: "The status page has failed every probe for 2 minutes."
              description: "Blackbox exporter gets an error or a status outside 200 to 299 from the status page, or Prometheus gets no probe result at all."
              runbook_url: https://github.com/your-user/your-monitor/blob/main/docs/runbook.md#statuspagedown
  # endregion: status-page-down

  # region: certificate
  # The certificate of the public page expires in 13 days: a ticket. The
  # one that expires in 60 days opens nothing.
  - name: a certificate that expires within 14 days opens a ticket
    interval: 1m
    input_series:
      - series: 'probe_ssl_earliest_cert_expiry{job="status-page-probe", instance="https://status.example.com/api/monitors"}'
        values: '1123200x10'
      - series: 'probe_ssl_earliest_cert_expiry{job="status-page-probe", instance="https://other.example.com/api/monitors"}'
        values: '5184000x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: CertificateExpiresSoon
        exp_alerts:
          - exp_labels:
              severity: ticket
              slo: availability
              job: status-page-probe
              instance: https://status.example.com/api/monitors
            exp_annotations:
              summary: "The certificate of https://status.example.com/api/monitors expires in 12d 23h 59m 0s."
              description: "cert-manager renews a Let's Encrypt certificate 30 days before expiry. A certificate this close to expiry means every renewal has failed for two weeks."
              runbook_url: https://github.com/your-user/your-monitor/blob/main/docs/runbook.md#certificateexpiressoon
  # endregion: certificate

  - name: the watchdog always fires
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: heartbeat
            exp_annotations:
              summary: "The alerting pipeline works. This alert always fires."
              runbook_url: https://github.com/your-user/your-monitor/blob/main/docs/runbook.md#watchdog
