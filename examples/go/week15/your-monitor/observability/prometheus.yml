# region: prometheus
# Prometheus scrapes every target every 15 seconds: it sends GET /metrics
# and stores each number in the answer with the time of the scrape.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:2112"]

  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:2112"]

  # A fixed target: when the worker stops, the scrape fails and
  # up{job="worker"} reads 0, which an alert can catch. With more than one
  # worker container, the name worker answers with one of them per scrape.
  - job_name: worker
    static_configs:
      - targets: ["worker:6060"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
# endregion: prometheus
