# region: namespace
# The namespace holds every object of the monitor. With the enforce label,
# the API server refuses any pod in it that breaks the restricted Pod
# Security Standard: a root user, privilege escalation, extra capabilities,
# no seccomp profile, or a volume from the node filesystem. Enforce checks
# pods only. The warn label checks the pod template of a Deployment or a
# StatefulSet too, and kubectl apply prints a warning for each breach.
apiVersion: v1
kind: Namespace
metadata:
  name: your-monitor
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
# endregion: namespace
