# region: tunnel
# The tunnel user exists for deploy.yml. It can forward one port, to the
# Kubernetes API server on this machine, and do nothing else. A Match
# block in an included file ends with that file.
Match User tunnel
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:6443
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    ForceCommand /usr/sbin/nologin
# endregion: tunnel
